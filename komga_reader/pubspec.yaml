name: komga_reader
description: A minimalist Komga reading client for Android and Windows.
publish_to: "none"
version: 1.6.0+163

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  clock: ^1.1.1
  dart_smb2: ^0.2.3 # network shares (SMB) on Android and iOS - libsmb2, LGPL-2.1, loaded as its own library
  flutter_secure_storage: ^11.2.0
  koni_archive_core: ^0.9.0
  koni_rar: # CBR (RAR4 and RAR5), pure Dart - vendored with two additions (third_party/koni_rar/pubspec.yaml)
    path: third_party/koni_rar
  http: ^1.2.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/denoise.frag
    - shaders/lanczos.frag
    - shaders/rcas.frag
    - shaders/colours.frag
    - shaders/easu.frag
    - shaders/curl.frag
  assets:
    - assets/icon.png
    - assets/docs/README.md
    - assets/docs/CHANGELOG.md
    - assets/docs/THIRD_PARTY_NOTICES.md
    - assets/licences/apache-2.0.txt
    # EPUB: hyphenation patterns (hyph-utf8; licences in LICENSE.txt) and the reading fonts' licences (OFL)
    - assets/hyphenation/hyph-en-us.pat.txt
    - assets/hyphenation/hyph-en-us.hyp.txt
    - assets/hyphenation/hyph-fr.pat.txt
    - assets/hyphenation/LICENSE.txt
    # the offline English dictionary behind Define (Open English WordNet; tools\dictionary\build_dictionary.py)
    - assets/dictionary/en.txt.gz
    - assets/dictionary/LICENSE.txt
    - assets/fonts/Literata-OFL.txt
    - assets/fonts/Lora-OFL.txt
    - assets/fonts/AtkinsonHyperlegibleNext-OFL.txt
    - assets/fonts/EBGaramond-OFL.txt
  # EPUB reading fonts (user, 2026-10-06), variable: weight from the wght axis (layout.dart)
  fonts:
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata.ttf
        - asset: assets/fonts/Literata-Italic.ttf
          style: italic
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora.ttf
        - asset: assets/fonts/Lora-Italic.ttf
          style: italic
    - family: Atkinson Hyperlegible Next
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext.ttf
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Italic.ttf
          style: italic
    - family: EB Garamond
      fonts:
        - asset: assets/fonts/EBGaramond.ttf
        - asset: assets/fonts/EBGaramond-Italic.ttf
          style: italic
