# Builds BeDeReader for iPhone / iPad, signs it and uploads it to App Store Connect, where it shows up in TestFlight
# (user, 2026-10-12: TestFlight rather than sideloading - no cable, builds that last 90 days). Signing is Xcode's own,
# managed through the App Store Connect API key: no certificate or profile is kept anywhere.
# Run it from the Actions tab ("Run workflow"). Needs these repository secrets (Settings > Secrets and variables >
# Actions), added by the user:
#   ASC_KEY_ID       the API key's Key ID
#   ASC_ISSUER_ID    the Issuer ID shown above the keys list
#   ASC_KEY_P8       the whole text of the AuthKey_XXXX.p8 file
#   APPLE_TEAM_ID    the team ID (Membership details on developer.apple.com)
name: TestFlight

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: komga_reader
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: The secrets are there
        run: |
          for s in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!s}" ]; then echo "::error::The repository secret $s isn't set"; exit 1; fi
          done

      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5 # the same as the Windows / Android builds
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: The API key on disk (only for this run)
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then echo "::error::The repository secret ASC_KEY_P8 isn't set"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      # Flutter's side (the Dart code compiled, the version and build number set); Xcode builds and signs the rest.
      # Build numbers: this workflow's run number + 1000, above anything the unsigned iOS build used.
      - name: Flutter's part
        run: flutter build ios --release --config-only --build-number=$((1000 + ${{ github.run_number }}))

      - name: Archive (signed by Xcode through the API key)
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive

      - name: Export and upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: The API key off disk
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
