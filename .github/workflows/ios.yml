# Builds BeDeReader for iPhone / iPad on a GitHub macOS runner (free for public repositories) - unsigned: sign and
# install it from Windows with Sideloadly or AltStore (free Apple ID: 7 days), or add signing later for TestFlight.
# The result is the "BeDeReader-ios" artifact on the run's page: BeDeReader-unsigned.ipa.
name: iOS build

on:
  workflow_dispatch: # the "Run workflow" button on the Actions tab
  push:
    branches: [ios]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: komga_reader
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5 # the same as the Windows / Android builds
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Build (unsigned)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Package as .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr BeDeReader-unsigned.ipa Payload
          ls -lh BeDeReader-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: BeDeReader-ios
          path: komga_reader/BeDeReader-unsigned.ipa
          retention-days: 30
