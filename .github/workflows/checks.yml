# Static checks and the test suite on every push and pull request (the same checks tools\build.ps1 runs first).
name: checks

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: komga_reader
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      # the SDK's shared files, Material's Roboto among them: settings_remote_test lays out in the real font, and the
      # runner's cached SDK hasn't got it (that test failed here from build 94 on - 2026-10-12)
      - run: flutter precache --universal
      - run: flutter analyze # lint findings count too (they report as infos)
      - run: flutter test
